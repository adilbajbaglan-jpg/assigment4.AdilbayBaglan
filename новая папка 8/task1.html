<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a train ticket</title>
  <link rel="stylesheet" href="assets/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="container py-4">
  <section class="form-card mx-auto" aria-labelledby="title">
    <header><h1 id="title">Book a train ticket</h1></header>
    <form action="task1.html" method="get" class="p-4 p-md-5"><div class="row g-3">
<fieldset class="col-12 mb-2"><legend class="visually-hidden">Journey type</legend><div class="btn-group trip">
<input class="btn-check" type="radio" name="journey" id="one-way" value="one-way"><label class="btn" for="one-way">One way</label>
<input class="btn-check" type="radio" name="journey" id="round-trip" value="round-trip"><label class="btn" for="round-trip">Round trip</label></div></fieldset><div class="col-12 col-md-6"><div class="city-field"><label for="from">From</label><input id="from" name="from" class="form-control" type="text" placeholder="Astana" required></div></div><div class="col-12 col-md-6"><div class="city-field"><label for="to">To</label><input id="to" name="to" class="form-control" type="text" placeholder="Almaty" required></div></div><div class="col-12 col-md-4"><label class="form-label" for="departure">Departure</label>
<input class="form-control" type="date" id="departure" name="departure" required>
</div><div class="col-12 col-md-4"><label class="form-label" for="return">Return</label>
<input class="form-control" type="date" id="return" name="return" >
</div><div class="col-12 col-md-4"><label class="form-label" for="passengers">Passengers</label>
<select class="form-select" id="passengers" name="passengers" required><option value="">Choose...</option><option value="1">1 adult</option><option value="2">2 adults</option><option value="3">3 adults</option><option value="4">4 adults</option><option value="5">5 adults</option><option value="6">6 adults</option></select>
</div><fieldset class="col-12"><legend class="form-label">Carriage class</legend><div class="form-check form-check-inline"><input class="form-check-input" type="radio" id="carriage-0" name="carriage" value="Seat" required><label class="form-check-label" for="carriage-0">Seat</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="radio" id="carriage-1" name="carriage" value="Coupé" required><label class="form-check-label" for="carriage-1">Coupé</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="radio" id="carriage-2" name="carriage" value="Sleeper" required><label class="form-check-label" for="carriage-2">Sleeper</label></div></fieldset><div class="col-12 col-md-6"><label for="phone" class="form-label">Phone</label><div class="input-group"><span class="input-group-text" id="country-code">+7</span><input class="form-control" type="tel" id="phone" name="phone" placeholder="701 234 56 78" autocomplete="tel" aria-describedby="country-code" required></div></div><div class="col-12 col-md-6"><label class="form-label" for="email">Email</label>
<input class="form-control" type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
</div><div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms" value="yes"><label class="form-check-label" for="sms">Also send the ticket by SMS</label></div>
<div class="form-check mt-2"><input class="form-check-input" type="checkbox" id="agreement" name="agreement" value="accepted" required><label class="form-check-label" for="agreement">I agree with the carriage rules</label></div></div>
<div class="col-12 d-flex flex-column-reverse flex-md-row justify-content-md-end gap-2 mt-4"><button class="btn btn-clear" type="reset">Clear</button><button class="btn btn-find" type="submit">Find trains</button></div>
</div></form>
  </section>
</main>
</body>
</html>
